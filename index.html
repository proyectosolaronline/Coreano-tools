<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Traductor IA</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: #16213e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #aaa;
            font-size: 14px;
        }
        
        .chat-box {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            word-wrap: break-word;
        }
        
        .bot-message {
            background: #1a1a2e;
            color: #fff;
            border-left: 3px solid #e94560;
        }
        
        .user-message {
            background: #e94560;
            color: #fff;
            text-align: right;
            border-right: 3px solid #fff;
        }
        
        .translation {
            margin-top: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            font-size: 16px;
            color: #ffd700;
        }
        
        .original-text {
            color: #aaa;
            font-size: 12px;
            margin-top: 5px;
            font-style: italic;
        }
        
        .speak-btn {
            margin-top: 8px;
            padding: 8px 15px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .speak-btn:hover {
            background: #ff6b81;
        }
        
        .retranslate-btn {
            margin-top: 8px;
            padding: 8px 15px;
            background: #533483;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .retranslate-btn:hover {
            background: #6c4fa7;
        }
        
        .language-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        
        select {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f3460;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        
        select option {
            background: #16213e;
        }
        
        .swap-btn {
            padding: 12px 15px;
            background: #533483;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
        }
        
        input::placeholder {
            color: #888;
        }
        
        .mic-btn {
            padding: 15px 20px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
        }
        
        .mic-btn.listening {
            background: #ff0000;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .translate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e94560, #533483);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .translate-btn:hover {
            opacity: 0.9;
        }
        
        .qr-section {
            text-align: center;
            padding: 15px;
            background: #0f3460;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .qr-section h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .qr-section img {
            width: 120px;
            height: 120px;
            background: #fff;
            padding: 5px;
            border-radius: 8px;
        }
        
        .qr-section p {
            color: #aaa;
            font-size: 11px;
            margin-top: 8px;
            word-break: break-all;
        }
        
        .status {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .clear-btn {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .clear-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Traductor IA</h1>
            <p id="subtitle">🇲🇽 Español → 🇰🇷 Coreano</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                👋 ¡Hola! Soy tu traductor inteligente.<br>
                Escribe o habla para traducir al instante.
            </div>
        </div>

        <div class="language-row">
            <select id="sourceLang" onchange="updateSubtitle()">
                <option value="es">🇲🇽 Español</option>
                <option value="en">🇺🇸 English</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="ko">🇰🇷 한국어</option>
                <option value="zh-CN">🇨🇳 中文</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pt">🇧🇷 Português</option>
            </select>
            
            <button class="swap-btn" onclick="swapLanguages()">⇄</button>
            
            <select id="targetLang" onchange="updateSubtitle()">
                <option value="ko">🇰🇷 한국어</option>
                <option value="es">🇲🇽 Español</option>
                <option value="en">🇺🇸 English</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="zh-CN">🇨🇳 中文</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pt">🇧🇷 Português</option>
            </select>
        </div>

        <div class="input-row">
            <input type="text" id="textInput" placeholder="Escribe texto aquí..." />
            <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        </div>

        <button class="translate-btn" onclick="translateText()">➤ Traducir</button>
        <button class="clear-btn" onclick="clearChat()">🗑️ Limpiar conversación</button>

        <div class="qr-section">
            <h3>📱 Comparte esta página</h3>
            <img id="qrCode" src="" alt="QR Code" />
            <p id="qrUrl"></p>
        </div>

        <div class="status" id="status">✅ Listo para traducir</div>
    </div>

    <script>
        // Variables globales
        let lastSourceText = '';  // Último texto original
        let lastSourceLang = '';  // Idioma del último texto original
        let recognition = null;
        let isListening = false;
        
        // Actualizar subtítulo
        function updateSubtitle() {
            const source = document.getElementById('sourceLang');
            const target = document.getElementById('targetLang');
            const sourceText = source.options[source.selectedIndex].text;
            const targetText = target.options[target.selectedIndex].text;
            document.getElementById('subtitle').textContent = `${sourceText} → ${targetText}`;
        }
        
        // Intercambiar idiomas
        function swapLanguages() {
            const source = document.getElementById('sourceLang');
            const target = document.getElementById('targetLang');
            const temp = source.value;
            source.value = target.value;
            target.value = temp;
            updateSubtitle();
            document.getElementById('status').textContent = '🔄 Idiomas intercambiados';
        }
        
        // Función principal de traducción
        async function translateText(sourceText = null) {
            // Si no se proporciona texto, tomar del input
            const text = sourceText || document.getElementById('textInput').value.trim();
            
            if (!text) {
                document.getElementById('status').textContent = '⚠️ Escribe texto primero';
                return;
            }
            
            // Guardar el texto original y su idioma
            lastSourceText = text;
            lastSourceLang = document.getElementById('sourceLang').value;
            
            const source = document.getElementById('sourceLang').value;
            const target = document.getElementById('targetLang').value;
            const chatBox = document.getElementById('chatBox');
            
            // Mostrar mensaje del usuario solo si es texto nuevo
            if (!sourceText) {
                chatBox.innerHTML += `<div class="message user-message">${text}</div>`;
                document.getElementById('textInput').value = '';
            }
            
            document.getElementById('status').textContent = '⏳ Traduciendo...';
            
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`);
                const data = await response.json();
                
                if (data.responseData && data.responseData.translatedText) {
                    const translation = data.responseData.translatedText;
                    const sourceLangName = document.getElementById('sourceLang').selectedOptions[0].text;
                    const targetLangName = document.getElementById('targetLang').selectedOptions[0].text;
                    
                    chatBox.innerHTML += `
                        <div class="message bot-message">
                            ✅ Traducción (${sourceLangName} → ${targetLangName}):
                            <div class="translation">${translation}</div>
                            <div class="original-text">Original: ${text}</div>
                            <button class="speak-btn" onclick="speakText('${translation.replace(/'/g, "\\'")}', '${target}')">
                                🔊 Escuchar
                            </button>
                            <button class="retranslate-btn" onclick="retranslateLast('${text.replace(/'/g, "\\'")}')">
                                🔄 Re-traducir
                            </button>
                        </div>
                    `;
                    
                    document.getElementById('status').textContent = '✅ Traducción completada';
                } else {
                    chatBox.innerHTML += `<div class="message bot-message">❌ No se pudo traducir</div>`;
                    document.getElementById('status').textContent = '❌ Error en traducción';
                }
            } catch (error) {
                console.error('Error:', error);
                chatBox.innerHTML += `<div class="message bot-message">⚠️ Error de conexión</div>`;
                document.getElementById('status').textContent = '⚠️ Error de conexión';
            }
            
            // Scroll al final
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // Re-traducir el último texto con los idiomas actuales
        function retranslateLast(originalText) {
            // Restaurar el texto original en el input
            document.getElementById('textInput').value = originalText;
            
            // Actualizar el idioma de origen al del texto original
            document.getElementById('sourceLang').value = lastSourceLang;
            updateSubtitle();
            
            // Traducir con los idiomas actuales
            translateText(originalText);
        }
        
        // Reproducir texto
        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
                document.getElementById('status').textContent = '🔊 Reproduciendo...';
                utterance.onend = () => {
                    document.getElementById('status').textContent = '✅ Listo';
                };
            } else {
                alert('Tu navegador no soporta voz');
            }
        }
        
        // Limpiar chat
        function clearChat() {
            document.getElementById('chatBox').innerHTML = `
                <div class="message bot-message">
                    👋 ¡Hola! Soy tu traductor inteligente.<br>
                    Escribe o habla para traducir al instante.
                </div>
            `;
            lastSourceText = '';
            lastSourceLang = '';
            document.getElementById('status').textContent = '🔄 Conversación limpiada';
        }
        
        // Controlar micrófono
        function toggleMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert('Usa Chrome o Edge para el micrófono');
                return;
            }
            
            const micBtn = document.getElementById('micBtn');
            
            if (isListening) {
                recognition.stop();
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('sourceLang').value;
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = '🔴';
                document.getElementById('status').textContent = '🎤 Escuchando...';
            };
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('textInput').value = text;
                document.getElementById('status').textContent = '✅ Texto capturado';
                
                // Traducir automáticamente
                setTimeout(() => translateText(), 500);
            };
            
            recognition.onerror = (event) => {
                console.error('Error:', event.error);
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                
                switch(event.error) {
                    case 'not-allowed':
                        document.getElementById('status').textContent = '⚠️ Permiso denegado';
                        break;
                    case 'no-speech':
                        document.getElementById('status').textContent = '⚠️ No se detectó voz';
                        break;
                    default:
                        document.getElementById('status').textContent = '⚠️ Error: ' + event.error;
                }
            };
            
            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
            };
            
            recognition.start();
        }
        
        // Generar QR al cargar
        window.onload = function() {
            const url = window.location.href;
            document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}`;
            document.getElementById('qrUrl').textContent = url;
            updateSubtitle();
            
            // Permitir Enter
            document.getElementById('textInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    translateText();
                }
            });
        };
    </script>
</body>
</html>
